<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ForgeBoard — Manufacturing Command Center</title>
<meta name="description" content="A fast, smart task and team command board built for manufacturing managers." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%23ff8a3d%22/><path d=%22M6 16 L10 9 L13 13 L18 6%22 stroke=%22%230b1220%22 stroke-width=%222.4%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>">
<style>
:root{
  --bg:#0b1220; --bg-elev:#101a2e; --bg-card:#162138; --bg-card-hover:#1b2846;
  --border:rgba(255,255,255,.09); --border-soft:rgba(255,255,255,.05);
  --text:#e9eefb; --text-dim:#94a1c2; --text-faint:#5f6c8c;
  --accent:#ff8a3d; --accent-soft:rgba(255,138,61,.15);
  --cyan:#3dd6ff; --blue:#5b8cff; --amber:#ffb020; --red:#ff5c6a; --green:#33d69f; --purple:#b18aff;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --radius:14px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
:root[data-theme="light"]{
  --bg:#f2f4fa; --bg-elev:#ffffff; --bg-card:#ffffff; --bg-card-hover:#f7f9ff;
  --border:rgba(20,30,60,.10); --border-soft:rgba(20,30,60,.06);
  --text:#141a2c; --text-dim:#586487; --text-faint:#9aa4c0;
  --accent:#e5711f; --accent-soft:rgba(229,113,31,.12);
  --shadow:0 10px 24px rgba(30,40,80,.10);
}
@media (prefers-color-scheme: light){
  html:not([data-theme="dark"]){
    --bg:#f2f4fa; --bg-elev:#ffffff; --bg-card:#ffffff; --bg-card-hover:#f7f9ff;
    --border:rgba(20,30,60,.10); --border-soft:rgba(20,30,60,.06);
    --text:#141a2c; --text-dim:#586487; --text-faint:#9aa4c0;
    --accent:#e5711f; --accent-soft:rgba(229,113,31,.12);
    --shadow:0 10px 24px rgba(30,40,80,.10);
  }
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--font);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
::selection{background:var(--accent); color:#101010;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
a{color:inherit;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}

.icon{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px;}

/* ---------- App shell ---------- */
#app{min-height:100%;display:flex;flex-direction:column;}

.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:18px;
  padding:14px 22px; border-bottom:1px solid var(--border);
  background:linear-gradient(180deg, var(--bg-elev), var(--bg-elev) 90%, transparent);
  backdrop-filter:blur(10px);
}
.brand{display:flex; align-items:center; gap:10px; flex:none;}
.brand-mark{
  width:34px;height:34px;border-radius:9px;flex:none;
  background:linear-gradient(135deg, var(--accent), #ffb35c);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px var(--accent-soft);
}
.brand-mark svg{width:18px;height:18px;stroke:#161010;stroke-width:2.6;}
.brand-text{display:flex;flex-direction:column;line-height:1.15;}
.brand-text b{font-size:16px;letter-spacing:.2px;}
.brand-text span{font-size:11px;color:var(--text-faint);}

.quickadd{
  flex:1; display:flex; align-items:center; gap:10px;
  background:var(--bg-card); border:1px solid var(--border); border-radius:12px;
  padding:10px 14px; transition:border-color .15s, box-shadow .15s;
  max-width:760px;
}
.quickadd:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
.quickadd .icon{color:var(--text-faint); flex:none;}
.quickadd input{
  flex:1; background:none; border:none; outline:none; color:var(--text); font-size:14px;
}
.quickadd input::placeholder{color:var(--text-faint);}
.quickadd .hint{font-size:11px;color:var(--text-faint); flex:none; display:none;}
@media(min-width:900px){.quickadd .hint{display:block;}}
.quickadd button{
  flex:none; background:var(--accent); color:#171008; border:none; border-radius:8px;
  padding:7px 14px; font-weight:600; font-size:13px; cursor:pointer; transition:transform .12s, filter .12s;
}
.quickadd button:hover{filter:brightness(1.08); transform:translateY(-1px);}
.quickadd button:active{transform:translateY(0);}

.topbar-actions{display:flex; align-items:center; gap:8px; flex:none;}
.iconbtn{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--bg-card);
  color:var(--text-dim); display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:all .15s;
}
.iconbtn:hover{color:var(--text); border-color:var(--accent); background:var(--bg-card-hover);}

/* ---------- Layout ---------- */
.layout{display:flex; flex:1; min-height:0;}
.sidebar{
  width:270px; flex:none; border-right:1px solid var(--border); padding:18px 14px;
  overflow-y:auto; display:flex; flex-direction:column; gap:22px;
}
@media(max-width:940px){ .sidebar{display:none;} }

.side-section b{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--text-faint); margin-bottom:10px; padding:0 4px;}
.filter-row{
  display:flex; align-items:center; gap:9px; padding:7px 8px; border-radius:9px; cursor:pointer;
  font-size:13.5px; color:var(--text-dim); transition:background .12s, color .12s; user-select:none;
}
.filter-row:hover{background:var(--bg-card); color:var(--text);}
.filter-row.active{background:var(--accent-soft); color:var(--text); font-weight:600;}
.dot{width:9px;height:9px;border-radius:3px;flex:none;}
.filter-row .count{margin-left:auto; font-size:11px; color:var(--text-faint); background:var(--border-soft); padding:1px 7px; border-radius:20px;}

.today-panel{
  background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:14px;
}
.today-panel .th{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;margin-bottom:10px;color:var(--accent);}
.focus-item{display:flex; gap:9px; align-items:flex-start; padding:7px 4px; border-radius:8px; cursor:pointer;}
.focus-item:hover{background:var(--bg-card-hover);}
.focus-item .fdot{width:7px;height:7px;border-radius:50%;margin-top:6px;flex:none;}
.focus-item .ft{font-size:12.5px; line-height:1.35;}
.focus-item .fm{font-size:10.5px;color:var(--text-faint);}
.empty-note{font-size:12px;color:var(--text-faint); padding:4px;}

.templates{display:flex; flex-wrap:wrap; gap:6px;}
.tpl-chip{
  font-size:11.5px; padding:5px 10px; border-radius:20px; border:1px solid var(--border);
  background:var(--bg-card); color:var(--text-dim); cursor:pointer; transition:all .12s;
}
.tpl-chip:hover{border-color:var(--accent); color:var(--text); background:var(--accent-soft);}

/* ---------- Main ---------- */
.main{flex:1; min-width:0; display:flex; flex-direction:column; overflow-y:auto;}
.main-inner{padding:20px 24px 60px; max-width:1400px; width:100%; margin:0 auto;}

.tabs{display:flex; gap:6px; margin-bottom:18px; border-bottom:1px solid var(--border);}
.tab{
  padding:10px 4px; margin-right:18px; font-size:14px; font-weight:600; color:var(--text-faint);
  border-bottom:2px solid transparent; cursor:pointer; transition:color .12s;
}
.tab:hover{color:var(--text);}
.tab.active{color:var(--text); border-color:var(--accent);}

.kpi-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px;}
.kpi{
  background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px;
  display:flex; flex-direction:column; gap:4px; position:relative; overflow:hidden;
}
.kpi:before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--k-color,var(--accent));}
.kpi b{font-size:24px; letter-spacing:-.02em;}
.kpi span{font-size:11.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em;}
.kpi.ring{flex-direction:row; align-items:center; gap:14px;}
.kpi.ring > div{display:flex; flex-direction:column; gap:4px;}

.board{display:grid; grid-template-columns:repeat(4,minmax(240px,1fr)); gap:14px; align-items:start;}
@media(max-width:1100px){.board{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.board{grid-template-columns:1fr;}}

.col{background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius); min-height:120px; display:flex; flex-direction:column;}
.col.dragover{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft) inset;}
.col-head{display:flex; align-items:center; gap:8px; padding:13px 14px 10px;}
.col-head .dot{width:9px;height:9px;border-radius:50%;}
.col-head b{font-size:12.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim);}
.col-head .n{margin-left:auto; font-size:11.5px; color:var(--text-faint); background:var(--border-soft); padding:1px 8px; border-radius:20px;}
.col-body{padding:2px 10px 12px; display:flex; flex-direction:column; gap:9px; min-height:60px;}

.card{
  background:var(--bg-card); border:1px solid var(--border); border-radius:11px; padding:11px 12px;
  cursor:grab; transition:transform .12s, border-color .12s, box-shadow .12s; position:relative;
}
.card:hover{border-color:var(--accent); box-shadow:var(--shadow); transform:translateY(-1px);}
.card.dragging{opacity:.4;}
.card .ctop{display:flex; align-items:flex-start; gap:8px; margin-bottom:8px;}
.card .flag{width:7px;height:7px;border-radius:50%; margin-top:6px; flex:none;}
.card .title{font-size:13.5px; line-height:1.4; font-weight:500;}
.card .meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.tagchip{font-size:10.5px; padding:2px 7px; border-radius:6px; font-weight:600; letter-spacing:.02em;}
.duechip{font-size:10.5px; padding:2px 7px; border-radius:6px; display:flex; align-items:center; gap:3px; color:var(--text-faint); background:var(--border-soft);}
.duechip.overdue{color:var(--red); background:rgba(255,92,106,.14);}
.duechip.today{color:var(--amber); background:rgba(255,176,32,.14);}
.avatar{
  width:22px;height:22px;border-radius:50%; display:flex;align-items:center;justify-content:center;
  font-size:9.5px; font-weight:700; color:#0c0e16; flex:none; margin-left:auto;
}
.card .crow{display:flex;align-items:center;gap:8px; margin-top:8px;}

.empty-col{padding:18px 8px; text-align:center; color:var(--text-faint); font-size:12px;}

/* team tab */
.team-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px;}
.team-card{background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:16px;}
.team-head{display:flex; align-items:center; gap:11px; margin-bottom:12px;}
.avatar.lg{width:40px;height:40px;font-size:14px;}
.team-name{font-weight:700; font-size:14.5px;}
.team-role{font-size:11.5px; color:var(--text-faint);}
.team-stats{display:flex; gap:14px; margin-bottom:10px;}
.tstat b{font-size:16px; display:block;}
.tstat span{font-size:10px; color:var(--text-faint); text-transform:uppercase;}
.bar{height:6px; border-radius:4px; background:var(--border-soft); overflow:hidden; display:flex;}
.bar > i{display:block; height:100%;}
.team-remove{margin-left:auto; color:var(--text-faint); cursor:pointer; opacity:.6;}
.team-remove:hover{opacity:1; color:var(--red);}
.add-team-card{
  border:1.5px dashed var(--border); border-radius:var(--radius); display:flex; align-items:center; justify-content:center;
  gap:8px; color:var(--text-faint); cursor:pointer; min-height:110px; font-size:13px; transition:all .12s;
}
.add-team-card:hover{color:var(--accent); border-color:var(--accent);}

/* timeline */
.timeline{display:flex; flex-direction:column; gap:0; max-width:740px;}
.tl-item{display:flex; gap:14px; padding:10px 0; border-left:2px solid var(--border); margin-left:6px; padding-left:20px; position:relative;}
.tl-item:before{content:"";position:absolute; left:-6px; top:14px; width:10px;height:10px;border-radius:50%; background:var(--accent); border:2px solid var(--bg);}
.tl-text{font-size:13.5px;}
.tl-time{font-size:11.5px; color:var(--text-faint); margin-top:2px;}

/* Modal */
.overlay{
  position:fixed; inset:0; background:rgba(4,7,16,.6); backdrop-filter:blur(3px);
  display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
}
.overlay.show{display:flex;}
.modal{
  background:var(--bg-elev); border:1px solid var(--border); border-radius:16px; width:100%; max-width:520px;
  box-shadow:0 30px 60px rgba(0,0,0,.5); max-height:88vh; overflow-y:auto;
}
.modal-head{display:flex; align-items:center; padding:16px 18px; border-bottom:1px solid var(--border);}
.modal-head b{font-size:14px;}
.modal-close{margin-left:auto; cursor:pointer; color:var(--text-faint);}
.modal-close:hover{color:var(--text);}
.modal-body{padding:18px; display:flex; flex-direction:column; gap:14px;}
.field label{display:block; font-size:11.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%; background:var(--bg-card); border:1px solid var(--border); border-radius:9px; padding:9px 11px;
  color:var(--text); font-size:13.5px; outline:none; transition:border-color .12s;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);}
.field textarea{resize:vertical; min-height:60px;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.modal-foot{display:flex; align-items:center; gap:8px; padding:14px 18px; border-top:1px solid var(--border);}
.btn{padding:9px 16px; border-radius:9px; font-size:13px; font-weight:600; cursor:pointer; border:1px solid var(--border); background:var(--bg-card); color:var(--text); transition:all .12s;}
.btn:hover{border-color:var(--accent);}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#171008;}
.btn.primary:hover{filter:brightness(1.08);}
.btn.danger{color:var(--red); margin-left:auto;}
.btn.danger:hover{border-color:var(--red);}

.toast{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
  background:var(--bg-elev); border:1px solid var(--border); color:var(--text); padding:10px 18px; border-radius:10px;
  font-size:13px; box-shadow:var(--shadow); z-index:200; transition:all .25s; pointer-events:none;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

.section-title{font-size:15px; font-weight:700; margin:0 0 14px;}
.mobile-note{display:none; font-size:12px; color:var(--text-faint); margin-bottom:12px;}
@media(max-width:940px){.mobile-note{display:block;}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24"><path d="M4 15 L9 7 L13 12 L20 4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="brand-text"><b>ForgeBoard</b><span id="dateLabel">Command Center</span></div>
    </div>
    <form class="quickadd" id="quickAddForm">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="quickAddInput" type="text" placeholder='Try: "Fix Line 3 conveyor @Mehmet #maintenance !urgent tomorrow"' autocomplete="off" />
      <span class="hint">@who · #area · !priority · a day</span>
      <button type="submit">Add task</button>
    </form>
    <div class="topbar-actions">
      <button class="iconbtn" id="themeToggle" title="Toggle theme">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="iconbtn" id="exportBtn" title="Export backup">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>
      </button>
      <button class="iconbtn" id="importBtn" title="Import backup">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 21V9M7 14l5-5 5 5M4 3h16"/></svg>
      </button>
      <input type="file" id="importFile" accept="application/json" style="display:none" />
    </div>
  </div>

  <div class="layout">
    <div class="sidebar">
      <div class="side-section">
        <b>Focus Areas</b>
        <div id="areaFilters"></div>
      </div>
      <div class="side-section">
        <b>Team</b>
        <div id="assigneeFilters"></div>
      </div>
      <div class="today-panel">
        <div class="th"><svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px;"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg> Today's Focus</div>
        <div id="todayFocus"></div>
      </div>
      <div class="side-section">
        <b>Quick Templates</b>
        <div class="templates" id="templateChips"></div>
      </div>
    </div>

    <div class="main">
      <div class="main-inner">
        <div class="mobile-note">Tip: rotate or widen your screen for filters &amp; the full board layout.</div>
        <div class="tabs">
          <div class="tab active" data-tab="board">Board</div>
          <div class="tab" data-tab="team">Team</div>
          <div class="tab" data-tab="timeline">Timeline</div>
        </div>

        <div id="view-board">
          <div class="kpi-row" id="kpiRow"></div>
          <div class="board" id="board"></div>
        </div>

        <div id="view-team" style="display:none;">
          <h2 class="section-title">Team workload</h2>
          <div class="team-grid" id="teamGrid"></div>
        </div>

        <div id="view-timeline" style="display:none;">
          <h2 class="section-title">Activity</h2>
          <div class="timeline" id="timelineList"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head"><b id="modalTitle">Task details</b><span class="modal-close" id="modalClose">
      <svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </span></div>
    <div class="modal-body">
      <div class="field"><label>Title</label><input id="f-title" type="text" /></div>
      <div class="field"><label>Notes</label><textarea id="f-notes" placeholder="Optional details..."></textarea></div>
      <div class="field-row">
        <div class="field"><label>Area</label><select id="f-area"></select></div>
        <div class="field"><label>Assignee</label><select id="f-assignee"></select></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Priority</label><select id="f-priority">
          <option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option><option value="urgent">Urgent</option>
        </select></div>
        <div class="field"><label>Status</label><select id="f-status">
          <option value="todo">To Do</option><option value="inprogress">In Progress</option><option value="blocked">Blocked</option><option value="done">Done</option>
        </select></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Due date</label><input id="f-due" type="date" /></div>
        <div class="field"><label>Tags (comma separated)</label><input id="f-tags" type="text" placeholder="e.g. line3, urgent-parts" /></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn primary" id="saveTaskBtn">Save</button>
      <button class="btn" id="cancelTaskBtn">Cancel</button>
      <button class="btn danger" id="deleteTaskBtn">Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
